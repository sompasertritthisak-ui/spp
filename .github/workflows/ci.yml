name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Database security audit (RLS, RBAC, IDOR, workflows)
        run: npm run db:test
      - name: Generated DB types are up to date
        run: npx tsx scripts/gen-types.ts && git diff --exit-code src/lib/backend/db-types.ts
      - name: Static export builds with NO back-end configured (seed content)
        run: npm run build
      - name: No secrets or blocked hosts in the shipped bundle
        run: node scripts/check-bundle.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
